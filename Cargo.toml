[package]
name = "brain"
version = "0.1.0"
edition = "2024"

[lib]
name = "brain"
path = "src/lib.rs"

[[bin]]
name = "brain"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
dialoguer = "0.11"
walkdir = "2.5"
notify = "8.0"

[dev-dependencies]
tempfile = "3.17"
insta = "1.42"
